services:
  ezbookkeeping:
    image: ${EBK_IMAGE:-ghcr.io/yourgaomu/ezbookkeeping:latest}
    container_name: ezbookkeeping
    restart: unless-stopped
    ports:
      - "${EBK_HTTP_PORT:-18082}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      EBK_CONF_PATH: /ezbookkeeping/conf/ezbookkeeping.ini
    volumes:
      - ./config/ezbookkeeping.ini:/ezbookkeeping/conf/ezbookkeeping.ini:ro
      - ./data:/ezbookkeeping/data
      - ./storage:/ezbookkeeping/storage
      - ./log:/ezbookkeeping/log
